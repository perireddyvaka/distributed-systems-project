version: '3.8'

services:
  # ============================================================================
  # COORDINATOR SERVICE
  # ============================================================================
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-coordinator
    command: ["python", "services/entrypoint_coordinator.py"]
    environment:
      - COORDINATOR_PORT=50050
      - SHARD_COUNT=2
      - SHARD_0_PRIMARY_HOST=shard0-primary
      - SHARD_0_PRIMARY_PORT=50051
      - SHARD_0_REPLICA_HOST=shard0-replica
      - SHARD_0_REPLICA_PORT=50061
      - SHARD_1_PRIMARY_HOST=shard1-primary
      - SHARD_1_PRIMARY_PORT=50052
      - SHARD_1_REPLICA_HOST=shard1-replica
      - SHARD_1_REPLICA_PORT=50062
    ports:
      - "50050:50050"
    depends_on:
      - shard0-primary
      - shard0-replica
      - shard1-primary
      - shard1-replica
    networks:
      - search-net
    restart: unless-stopped

  # ============================================================================
  # SHARD 0: PRIMARY & REPLICA
  # ============================================================================
  shard0-primary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-shard0-primary
    command: ["python", "services/entrypoint_shard.py"]
    environment:
      - SHARD_ID=0
      - ROLE=PRIMARY
      - PORT=50051
      - DB_PATH=/data/shard_0_primary.db
    ports:
      - "50051:50051"
    volumes:
      - shard0_primary_data:/data
    networks:
      - search-net
    restart: unless-stopped

  shard0-replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-shard0-replica
    command: ["python", "services/entrypoint_shard.py"]
    environment:
      - SHARD_ID=0
      - ROLE=REPLICA
      - PORT=50061
      - REPLICA_ID=replica_shard_0
      - DB_PATH=/data/shard_0_replica.db
    ports:
      - "50061:50061"
    volumes:
      - shard0_replica_data:/data
    networks:
      - search-net
    restart: unless-stopped

  # ============================================================================
  # SHARD 1: PRIMARY & REPLICA
  # ============================================================================
  shard1-primary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-shard1-primary
    command: ["python", "services/entrypoint_shard.py"]
    environment:
      - SHARD_ID=1
      - ROLE=PRIMARY
      - PORT=50052
      - DB_PATH=/data/shard_1_primary.db
    ports:
      - "50052:50052"
    volumes:
      - shard1_primary_data:/data
    networks:
      - search-net
    restart: unless-stopped

  shard1-replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-shard1-replica
    command: ["python", "services/entrypoint_shard.py"]
    environment:
      - SHARD_ID=1
      - ROLE=REPLICA
      - PORT=50062
      - REPLICA_ID=replica_shard_1
      - DB_PATH=/data/shard_1_replica.db
    ports:
      - "50062:50062"
    volumes:
      - shard1_replica_data:/data
    networks:
      - search-net
    restart: unless-stopped

# ==============================================================================
# PERSISTENT STORAGE VOLUMES & ISOLATED NETWORK
# ==============================================================================
volumes:
  shard0_primary_data:
  shard0_replica_data:
  shard1_primary_data:
  shard1_replica_data:

networks:
  search-net:
    driver: bridge
